# Separate light/dark sections keep the accent color while still following the
# viewer's light/dark preference (a single [theme] block would pin light mode).
[theme.light]
primaryColor = "#1DB954"

[theme.dark]
primaryColor = "#1DB954"

[browser]
gatherUsageStats = false

[server]
# Streamlit's file watcher crawls transformers' lazy modules and floods the log
# with harmless ModuleNotFoundError tracebacks; auto-reload isn't needed here.
fileWatcherType = "none"
